name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bhojbangla
          POSTGRES_USER: bhojbangla
          POSTGRES_PASSWORD: ci-test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bhojbangla -d bhojbangla"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test API
        working-directory: apps/api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bhojbangla
          SPRING_DATASOURCE_USERNAME: bhojbangla
          SPRING_DATASOURCE_PASSWORD: ci-test-only-password
        run: JWT_SECRET="$(openssl rand -hex 32)" mvn -B -U test
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @bhojbangla/web test
      - run: pnpm --filter @bhojbangla/web build

